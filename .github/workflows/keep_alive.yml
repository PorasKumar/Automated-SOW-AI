name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 3 hours (at minute 0 of every 3rd hour)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://automated-sow-engine.streamlit.app/
          echo " App pinged successfully at $(date)"